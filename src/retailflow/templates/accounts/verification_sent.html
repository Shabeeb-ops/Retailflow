<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | RetailFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f3ee;
            --card: #ffffff;
            --ink: #0d0d0d;
            --muted: #6d6b63;
            --line: #dedbd0;
            --blue: #2f6bff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .verify-box {
            width: 100%;
            max-width: 380px;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .logo-mark {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--ink);
            display: grid;
            place-items: center;
        }

        .logo-mark svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Card */
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .mail-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e8f0ff;
            display: grid;
            place-items: center;
        }

        .mail-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--blue);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: var(--muted);
        }

        h1 + p {
            margin-top: 10px;
        }

        p + p {
            margin-top: 8px;
        }

        .back-link {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .back-link a {
            font-weight: 600;
            color: var(--ink);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 440px) {
            .card {
                padding: 24px 18px;
            }
        }
    </style>
</head>

<body>

<div class="verify-box">

    <div class="logo">
        <div class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <circle cx="9" cy="20" r="1.5"/>
                <circle cx="18" cy="20" r="1.5"/>
                <path d="M2 3h3l2.5 12h11L21 7H6"/>
            </svg>
        </div>
        RetailFlow
    </div>

    <div class="card">

        <div class="mail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
            </svg>
        </div>

        <h1>Check your email</h1>

        <p>We have sent a verification link to your email address.</p>

        <p>Please open your email and click the verification link.</p>


        </p>

    </div>

</div>

</body>
</html>
