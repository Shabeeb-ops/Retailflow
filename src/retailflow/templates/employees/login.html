<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Login - RetailFlow</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--cream);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: var(--muted);

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid var(--line);

            border-radius: 10px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: var(--ink);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: var(--ink);

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: var(--ink);
        }

        .error {
            color: var(--ink);

            font-size: 13px;

            margin-bottom: 15px;
        }

        .employee-info {
            text-align: center;

            margin-top: 25px;

            color: var(--muted);

            font-size: 13px;
        }

    </style>

    {% include "shared/dashboard_theme.html" %}
</head>


<body class="theme-login">


<div class="login-container">

    <div class="logo">
        RetailFlow
    </div>

    <div class="subtitle">
        Employee Login
    </div>


    {% if form.non_field_errors %}

        <div class="error">

            {{ form.non_field_errors }}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Email
            </label>

            {{ form.email }}

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            {{ form.password }}

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="employee-info">

        Login using the email and password
        provided by your administrator.

    </div>

</div>


</body>

</html>
