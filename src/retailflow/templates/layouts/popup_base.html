<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --ink: #0d0d0d;
            --ink-2: #1c1c1c;
            --bg: #ffffff;
            --cream: #f4f3ee;
            --card: #ffffff;
            --line: #dedbd0;
            --muted: #6d6b63;
            --muted-dark: #8a8a85;
            --blue: #0d0d0d;
            --blue-dark: #0d0d0d;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--ink); background: transparent; font-size: 13px; line-height: 1.4; }

        /* Compact buttons */
        .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 16px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.15s ease; border: 1px solid var(--ink); background: var(--ink); color: #ffffff; white-space: nowrap; }
        .button:hover { background: var(--ink-2); }
        .button.secondary { background: #ffffff; color: var(--ink); border-color: var(--line); }
        .button.secondary:hover { background: var(--cream); border-color: var(--muted); }
        button:disabled, .button.disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

        /* Compact cards and panels */
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 0; min-height: min-content; height: auto; }
        
        /* Compact tables */
        table, tbody, thead, tr { height: auto !important; max-height: none !important; min-height: min-content !important; overflow: visible !important; }
        table { border-collapse: collapse; width: 100%; height: auto; display: table !important; }
        th { background: var(--cream); color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 10px; text-align: left; white-space: nowrap; height: auto !important; border-bottom: 1px solid var(--line); }
        td { color: var(--ink); font-size: 12px; border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; height: auto !important; }
        .purchase-table, .supplier-table, .table-card, .card.purchase-table, .table-container, .table-responsive, [class*="table"] { overflow-x: auto !important; overflow-y: visible !important; margin-bottom: 12px; width: 100% !important; min-height: min-content !important; height: auto !important; max-height: none !important; flex-shrink: 0 !important; }
        .purchase-table table, .supplier-table table, .table-card table { width: 100% !important; min-width: 600px; border-collapse: collapse; height: auto !important; }
        
        /* Badges */
        .status, .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; background: var(--cream); border: 1px solid var(--line); color: var(--ink); }
        .status.active, .badge.in-stock { background: #e6f4ea; border-color: #ceead6; color: #137333; }
        .status.inactive, .badge.out-of-stock { background: #fce8e6; border-color: #fad2cf; color: #c5221f; }
        
        .rf-popup-container { padding: 4px 6px; overflow-y: visible; height: auto; }

        /* ==========================================================================
           RETAILFLOW COMPACT POPUP FORM SYSTEM
           ========================================================================== */
        .rf-compact-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .rf-form-header {
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--line);
        }
        .rf-form-header h1, .rf-form-header h2 {
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 2px 0;
            letter-spacing: -0.01em;
            color: var(--ink);
        }
        .rf-form-header p {
            font-size: 11px;
            color: var(--muted);
            margin: 0;
            line-height: 1.3;
        }

        /* Compact Grids */
        .rf-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
        }
        .rf-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px 12px;
        }
        .rf-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px 12px;
        }
        .rf-col-span-2 { grid-column: span 2; }
        .rf-col-span-3 { grid-column: span 3; }
        .rf-col-span-full { grid-column: 1 / -1; }

        /* Compact Field */
        .rf-field {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .rf-field label,
        .rf-compact-form label:not(.rf-checkbox-label) {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rf-field input:not([type="checkbox"]),
        .rf-field select,
        .rf-field textarea,
        .rf-compact-form input:not([type="checkbox"]),
        .rf-compact-form select,
        .rf-compact-form textarea {
            width: 100%;
            height: 32px;
            padding: 4px 10px;
            font-size: 13px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #ffffff;
            color: var(--ink);
            box-sizing: border-box;
            font-family: inherit;
        }
        .rf-field input:focus, .rf-field select:focus, .rf-field textarea:focus,
        .rf-compact-form input:focus, .rf-compact-form select:focus, .rf-compact-form textarea:focus {
            border-color: var(--ink);
            outline: none;
        }

        .rf-field textarea,
        .rf-compact-form textarea {
            height: 38px !important;
            min-height: 34px !important;
            max-height: 52px !important;
            padding: 4px 10px !important;
            line-height: 1.3 !important;
            resize: none !important;
        }

        .rf-checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            margin-top: auto;
        }
        .rf-checkbox-field input[type="checkbox"] {
            width: 15px;
            height: 15px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--ink);
        }
        .rf-checkbox-field label,
        .rf-checkbox-label {
            font-size: 12px;
            font-weight: 500;
            margin: 0;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        /* Error and Help text */
        .rf-error-text, .error-text {
            display: block;
            font-size: 11px;
            color: #b91c1c;
            font-weight: 600;
            margin-top: 2px;
            line-height: 1.2;
        }
        .rf-help-text, .help-text, .helptext {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
            line-height: 1.2;
        }
        .errorlist {
            margin: 4px 0 8px;
            padding: 4px 10px 4px 16px;
            font-size: 11px;
            color: #b91c1c;
            border-left: 3px solid #b91c1c;
            background: #fff5f5;
            border-radius: 4px;
        }

        /* Compact Form Actions */
        .rf-form-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
        }

        @media (max-width: 720px) {
            .rf-grid-3, .rf-grid-4 { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .rf-grid-2, .rf-grid-3, .rf-grid-4 { grid-template-columns: 1fr; }
            .rf-col-span-2, .rf-col-span-3 { grid-column: span 1; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="rf-popup-body">
    <div class="rf-popup-container">
        {% block content %}{% endblock %}
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
