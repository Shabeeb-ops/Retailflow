{% if page_obj.has_other_pages %}
<nav class="supplier-pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}<a class="button secondary" href="?page={{ page_obj.previous_page_number }}&amp;q={{ search|urlencode }}&amp;status={{ selected_status|urlencode }}">Previous</a>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="button secondary" href="?page={{ page_obj.next_page_number }}&amp;q={{ search|urlencode }}&amp;status={{ selected_status|urlencode }}">Next</a>{% endif %}
</nav>
{% endif %}
